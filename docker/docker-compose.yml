services:
  mysql:
    image: mysql:8.0
    container_name: distriquery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: distriquery
      MYSQL_USER: distriquery
      MYSQL_PASSWORD: distriquery
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "distriquery", "-pdistriquery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: